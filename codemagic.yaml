# Codemagic yapılandırması — yalnızca iOS tarafı (ios/ klasörü) içindir.
# Android derlemesi buradan yapılmaz; app/ ve kök Gradle dosyalarına dokunmaz.
# Codemagic bu dosyayı depo kökünde arar, o yüzden ios/ içinde değil burada durur.

workflows:
  ios-shared-test:
    name: iOS ortak kod testleri
    instance_type: mac_mini_m2      # ücretsiz kotada kullanılabilen tek Mac türü
    max_build_duration: 45
    working_directory: ios
    environment:
      xcode: latest
      java: 17
    # Önbellek bilerek yok: kapanışta yüklenmesi 4-5 dakika sürüyor, kazandırdığından fazlasını harcıyor.
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'claude/sorobit-ios-*'
          include: true
      cancel_previous_builds: true
    # Dakika harcamamak için yalnızca iOS dosyaları değişince çalışır.
    when:
      changeset:
        includes:
          - 'ios/'
          - 'codemagic.yaml'
    scripts:
      - name: Gradle sarmalayıcısına çalıştırma izni
        script: chmod +x gradlew
      - name: JVM testleri
        script: ./gradlew :shared:jvmTest --no-daemon
        test_report: shared/build/test-results/jvmTest/*.xml
      - name: iOS simülatör testleri
        script: ./gradlew :shared:iosSimulatorArm64Test --no-daemon
        test_report: shared/build/test-results/iosSimulatorArm64Test/*.xml
      - name: Gerçek cihaz için framework bağlama
        script: ./gradlew :shared:linkDebugFrameworkIosArm64 --no-daemon
    artifacts:
      - $CM_BUILD_DIR/ios/shared/build/reports/tests/**

  ios-app-build:
    name: iOS uygulama derlemesi (simülatör)
    instance_type: mac_mini_m2
    max_build_duration: 45
    working_directory: ios
    environment:
      xcode: latest
      java: 17
    # Önbellek bilerek yok: kapanışta yüklenmesi 4-5 dakika sürüyor, kazandırdığından fazlasını harcıyor.
    # Tetikleyici yok: dakika harcamamak için yalnızca elle başlatılır.
    scripts:
      - name: Gradle sarmalayıcısına çalıştırma izni
        script: chmod +x gradlew
      - name: Xcode projesini üret
        working_directory: ios/iosApp
        script: |
          which xcodegen || brew install xcodegen
          xcodegen generate
      - name: Uygulamayı simülatör için derle
        working_directory: ios/iosApp
        # İmzasız, yalnızca Apple silicon simülatörü; Apple hesabı gerektirmez.
        script: |
          set -o pipefail
          mkdir -p build
          xcodebuild build \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/dd \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO | tee build/xcodebuild.log | tail -n 200
      - name: Simülatörde aç ve ekran görüntüsü al
        working_directory: ios/iosApp
        # Mac olmadan ekranı görebilmenin yolu; başarısız olsa da derleme sonucu etkilenmez.
        ignore_failure: true
        script: |
          UDID=$(xcrun simctl list devices available | grep -E "iPhone" | head -1 | grep -oE "[0-9A-F-]{36}")
          echo "Simülatör: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/dd/Build/Products/Debug-iphonesimulator/iosApp.app
          # Açılış (argümansız, gerçek akış): 3., 8. (ekran.png) ve 15. saniyede kare; 8. saniyede ana
          # iş parçacığının yığın örneği (takıldıysa nerede); sonra uygulamanın birleşik günlüğü
          # (YonetimGunlugu satırları "[sorobit]" ile başlar).
          xcrun simctl launch "$UDID" com.sorobit.app
          sleep 3
          xcrun simctl io "$UDID" screenshot build/ekran-03.png || true
          sleep 5
          xcrun simctl io "$UDID" screenshot build/ekran.png || true
          UYG_PID=$(pgrep -f "iosApp.app/iosApp" | head -1)
          echo "Uygulama süreci: $UYG_PID"
          if [ -n "$UYG_PID" ]; then sample "$UYG_PID" 2 -file build/ilk-acilis-ornek.txt || true; fi
          sleep 5
          xcrun simctl io "$UDID" screenshot build/ekran-15.png || true
          xcrun simctl spawn "$UDID" log show --last 1m --style compact --predicate 'process == "iosApp"' > build/ilk-acilis.log 2>&1 || true
          xcrun simctl terminate "$UDID" com.sorobit.app || true
          # Hesaplı açılış: `-oturum acik` hazır öğrenci hesabının oturumunu açık başlatır (Yonetim/SahteOrtam.swift).
          # Simülatörün dili İngilizce: "Telefonun dili" seçimiyle argümansız açılış İngilizce gelir.
          # Hesaplı açılış ve Türkçe galeri bu yüzden -dil tr ile açılır.
          xcrun simctl launch "$UDID" com.sorobit.app -oturum acik -dil tr || true
          sleep 8
          xcrun simctl io "$UDID" screenshot build/ekran-oturum.png || true
          xcrun simctl terminate "$UDID" com.sorobit.app || true
          # Ekran galerisi: her ekran -ekran <ad> ile tek tek açılıp görüntülenir
          # (adlar: iosApp/Yonetim/EkranGalerisi.swift içindeki EkranGalerisi.adlar).
          mkdir -p build/ekranlar
          for AD in giris giris-acilis giris-tanisma giris-eposta kayit kayit-yas kayit-kaynak kayit-abakus kayit-hedef kayit-yol kayit-meydan-okuma kayit-hatirlatma kayit-veli-onayi kayit-kod kabuk harita-kisim harita-ders harita-popover harita-kilitli-popover abakus-ders abakus-sandik kor-ders rehber-ders rehber-kor-ders rehber-maraton sonuc-basarili sonuc-basarisiz sonuc-sandik-basarisiz sonuc-sandik sandik gorevler gorevler-yeni kupa kupa-gecmisi kupa-yolu-odul lider-tablosu rozetler rozet-detay ozellestirme magaza magaza-alt profil profil-duzenle ses-ayarlari avatar avatar-duzenle yer-tutucu ogretici-1 ogretici-2 ogretici-3 ogretici-4 ogretici-5 ogretici-101-20 ogretici-22-34 ogretici-24-6 ogretici-24-14 ogretici-3-5 ogretici-5-10 ogretici-6-6 ogretici-105-4 ogretici-8-43 ogretici-11-1 ogretici-12-1 ogretici-17-1 maskot seri seri-kirik seri-meydan-okuma seri-kutlama seri-yeni seri-yeni-soru seri-hedef seri-hatirlatma kural-kitabi kural-kitabi-2 kural-paneli kural-paneli-carpim plan plan-secim plan-pro rozet-kutlama sobi-analiz sobi-analiz-2 yaris-paneli yaris-paneli-kilitli yaris-ders yaris-paneli-alt yaris-paneli-ileri-sar sobi-test sobi-test-kilitli sobi-test-sonuc sobi-test-oynatici; do
            xcrun simctl launch "$UDID" com.sorobit.app -ekran "$AD" -dil tr || true
            sleep 5
            xcrun simctl io "$UDID" screenshot "build/ekranlar/$AD.png" || true
            xcrun simctl terminate "$UDID" com.sorobit.app || true
          done
          # Aynı galeri İngilizce (-dil en: seçim kaydedilmez, Metin/Metin.swift); dosya adı <ad>@en.png.
          for AD in giris kayit-hedef harita-ders abakus-ders sonuc-basarili magaza plan-secim profil seri ogretici-3 sobi-analiz sobi-analiz-2 rozet-detay rozet-kutlama ozellestirme kupa kupa-gecmisi yaris-paneli sobi-test-sonuc; do
            xcrun simctl launch "$UDID" com.sorobit.app -ekran "$AD" -dil en || true
            sleep 5
            xcrun simctl io "$UDID" screenshot "build/ekranlar/$AD@en.png" || true
            xcrun simctl terminate "$UDID" com.sorobit.app || true
          done
    # Yollar tam verilir: göreli yollar working_directory nedeniyle bulunamadı.
    artifacts:
      - $CM_BUILD_DIR/ios/iosApp/build/ekran*.png
      - $CM_BUILD_DIR/ios/iosApp/build/ilk-acilis.log
      - $CM_BUILD_DIR/ios/iosApp/build/ilk-acilis-ornek.txt
      - $CM_BUILD_DIR/ios/iosApp/build/ekranlar/*.png
      - $CM_BUILD_DIR/ios/iosApp/build/xcodebuild.log
      # Ortak Kotlin kodunun Swift'e görünen adları (derleme hatası ayıklamak için).
      - $CM_BUILD_DIR/ios/shared/build/xcode-frameworks/**/Shared.framework/Headers/Shared.h
