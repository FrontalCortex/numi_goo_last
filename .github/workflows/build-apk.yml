name: Build Debug APK

on:
  push:
    branches:
      - 'claude/**'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Install fixed debug keystore
        # CI runner'ları her seferinde sıfırdan başladığı için Android Gradle Plugin,
        # ~/.android/debug.keystore yoksa RASTGELE bir sertifika üretir. Bu sertifika
        # Firebase/Google'da kayıtlı olmadığından Google Sign-In DEVELOPER_ERROR (10)
        # verir. Burada, SHA-1'i Firebase konsoluna kayıtlı SABİT bir debug keystore
        # kuruyoruz ki her build aynı imzayla çıksın.
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Debug build #${{ github.run_number }}
          body: "Otomatik debug build (commit ${{ github.sha }})"
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
